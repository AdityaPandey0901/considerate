[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "considerate"
version = "0.1.0"
description = "A drop-in, respectful rate-limiting layer for agents that fetch or scrape the web — protects the site being visited, not just the agent visiting it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Aditya Pandey" }]
keywords = [
    "agents",
    "web-scraping",
    "rate-limiting",
    "robots.txt",
    "ai-safety",
    "httpx",
    "circuit-breaker",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
requests = ["requests>=2.28"]
observability = ["prometheus-client>=0.16"]
validate = ["jsonschema>=4.0"]
mcp = ["mcp>=2.0"]
playwright = ["playwright>=1.40"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "hypothesis>=6.0",
    "requests>=2.28",
    "prometheus-client>=0.16",
    "playwright>=1.40",
    "langchain-core>=0.3",
    "mcp>=2.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/AdityaPandey0901/considerate"
Specification = "https://github.com/AdityaPandey0901/considerate/blob/main/SPEC.md"

[project.scripts]
considerate = "considerate.cli:main"
considerate-mcp = "considerate.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/considerate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: hits the real internet (example.com, google.com robots.txt); excluded by default, run explicitly with `pytest -m network`",
]
addopts = "-m 'not network'"

[tool.coverage.run]
source = ["considerate"]

[tool.mypy]
python_version = "3.10"  # matches requires-python above
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.report]
# 75%, not higher: honest floor for what's actually exercised in-process
# today, not a claim of exhaustive coverage. AsyncConsiderateBrowserPage in
# particular is undercounted — its only test runs in a genuinely separate
# subprocess (see tests/_async_browser_subprocess.py's docstring), whose
# coverage this tool can't see without extra COVERAGE_PROCESS_START
# plumbing not yet set up. Raise this floor as real coverage improves;
# don't lower it to make a change fit.
fail_under = 75
exclude_lines = ["if __name__ == .__main__.:"]
