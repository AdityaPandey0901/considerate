name: Publish to PyPI

# Triggered by pushing a tag like v0.2.0. Uses PyPI Trusted Publishing
# (OIDC) — no stored API token, nothing that can leak from repo secrets.
# One-time setup required on PyPI's side before this will work (see
# CONTRIBUTING.md's "Releasing" section): register this exact
# repo + workflow filename + environment as a trusted publisher for the
# `considerate` project at https://pypi.org/manage/project/considerate/settings/publishing/
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Verify the tag matches pyproject.toml's version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag v$tag_version does not match pyproject.toml's version $pkg_version — bump one of them."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
